<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayeyarwady Weather</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌦️ Ayeyarwady Weather</h1>
    <p>ဧရာဝတီတိုင်းဒေသကြီး မိုးလေဝသ</p>
  </header>

  <main>

    <div id="location">
      📍 တည်နေရာကို ရှာနေသည်...
    </div>

    <div id="weather">
      
 <p id="temperature">Temperature : -- °C</p>

  <p id="weatherText">Weather : --</p>

  <p id="rainChance">Rain Chance : -- %</p>

    </div>

    <button id="locationBtn">
      တည်နေရာဖွင့်ပါ
    </button>

  </main>

  <script src="script.js"></script>

</body>
</html>

<!-- 24-Hour Forecast Section -->
<div class="forecast-section">
  <h3>၂၄ နာရီ ခန့်မှန်းချက်</h3>
  <div id="hourly-forecast" class="scroll-container">
    <!-- JavaScript ကနေ အချက်အလက်များ လာထည့်ပေးမည် -->
  </div>
</div>

<!-- 7-Day Forecast Section -->
<div class="forecast-section">
  <h3>၇ ရက်စာ ခန့်မှန်းချက်</h3>
  <div id="daily-forecast" class="forecast-list">
    <!-- JavaScript ကနေ အချက်အလက်များ လာထည့်ပေးမည် -->
  </div>
</div>

<!-- Tide / Sea Water Section -->
<div class="forecast-section">
  <h3>🌊 ဒီရေ အတက်/အကျ အခြေအနေ</h3>
  <div id="tide-info" class="tide-container">
    <p>ဒီရေ အချက်အလက် ရယူနေသည်...</p>
  </div>
</div>
